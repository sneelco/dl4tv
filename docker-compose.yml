services:
  dl4tv:
    image: ghcr.io/sneelco/dl4tv:dev
    container_name: dl4tv
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      # Must match the redirect URI registered on your Google OAuth client.
      DL4TV_PUBLIC_URL: "http://localhost:8484"
      # Optional HTTP basic auth for the UI.
      # DL4TV_USERNAME: "admin"
      # DL4TV_PASSWORD: "change-me"
      DL4TV_LOG_LEVEL: "INFO"
    # Run as the user that owns your media library so downloads are readable
    # by ErsatzTV.
    user: "1000:1000"
    volumes:
      - ./config:/config
      # Point this at the library ErsatzTV scans.
      - /srv/media/youtube:/downloads
